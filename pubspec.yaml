name: Serden
description: Serden — contractor business management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fluttertoast: ^8.2.8

  # Forms
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.1.2

  # Device contacts picker
  flutter_contacts: ^1.1.9

  # Utils
  intl: ^0.20.0
  uuid: ^4.5.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-v20-latin-500.ttf
          weight: 500
        - asset: assets/fonts/manrope-v20-latin-600.ttf
          weight: 600
        - asset: assets/fonts/manrope-v20-latin-700.ttf
          weight: 700
        - asset: assets/fonts/manrope-v20-latin-800.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1B2B23FF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

# flutter pub run flutter_native_splash:create
flutter_native_splash:
  # The default background color (used for light theme)
  color: "#1B2B23FF"
  # An optional background color for dark mode
  color_dark: "#1B2B23FF" # A common dark theme background color

  # The image asset to show in the center.
  # Make sure you have these images in your assets/ folder
  # and that the assets folder is declared in pubspec.yaml
  image: assets/icons/app_icon.png
  # An optional image for dark mode
  image_dark: assets/icons/app_icon.png
  ios: true
  web: true

  # Android-specific options
  android_12:
    # On Android 12+, you can specify a separate image for the icon background.
    image: assets/icons/app_icon.png
    image_dark: assets/icons/app_icon.png
    icon_background_color: "#1B2B23FF"
    iconf_background_color_dark: "#1B2B23FF"

  # To hide the status bar on the splash screen, set fullscreen to true.
  fullscreen: true
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec